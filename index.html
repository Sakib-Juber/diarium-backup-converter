<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diarium Backup Converter (Robust Obsidian Export)</title>
  <!-- SQL.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <!-- JSZip for generating Obsidian Markdown folder -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #334155;
      color: var(--muted);
    }
    .status-badge.ready { background: #166534; color: #4ade80; }
    .status-badge.loading { background: #854d0e; color: #fef08a; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 8px;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .preview-box {
      max-height: 400px;
      overflow-y: auto;
      background: #090d16;
      padding: 16px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Diarium Backup Converter</h1>
      <span id="engineStatus" class="status-badge loading">Initializing SQLite Engine...</span>
    </header>

    <div class="card">
      <div id="dropZone" class="drop-zone">
        <p style="margin: 0 0 8px 0; font-size: 1.1rem;">Drag & drop your <strong>.diary</strong> or <strong>.diarium</strong> file here</p>
        <p style="margin: 0; color: var(--muted); font-size: 0.9rem;">or click to select file from your computer</p>
        <input type="file" id="fileInput" accept=".diary,.diarium,.db,.sqlite" class="hidden">
      </div>
    </div>

    <div id="statusCard" class="card hidden">
      <h3>Database Summary</h3>
      <div id="summaryContent"></div>
      <div style="margin-top: 16px;">
        <button id="exportObsidianZipBtn" class="btn" style="background: var(--success); color: #fff;">Export Obsidian Vault (.zip)</button>
        <button id="exportTxtBtn" class="btn">Export Single TXT</button>
        <button id="exportDocxBtn" class="btn">Export DOCX</button>
      </div>
    </div>

    <div id="previewCard" class="card hidden">
      <h3>Clean Preview</h3>
      <div id="previewContainer" class="preview-box"></div>
    </div>
  </div>

  <script>
    let dbInstance = null;
    let parsedEntries = [];
    let initPromise = null;

    function cleanHtmlToPlainText(htmlString) {
      if (!htmlString) return "";
      const tempDiv = document.createElement("div");
      let formatted = htmlString;

      formatted = formatted.replace(/<li[^>]*>/gi, "• ");
      formatted = formatted.replace(/<\/li>/gi, "\n");
      formatted = formatted.replace(/<\/p>/gi, "\n\n");
      formatted = formatted.replace(/<br\s*[\/]?>/gi, "\n");
      formatted = formatted.replace(/<\/div>/gi, "\n");
      formatted = formatted.replace(/<\/h[1-6]>/gi, "\n\n");

      tempDiv.innerHTML = formatted;
      let text = tempDiv.textContent || tempDiv.innerText || "";
      text = text.replace(/\n\s*\n\s*\n+/g, "\n\n").trim();
      return text;
    }

    function initSqlEngine() {
      if (initPromise) return initPromise;
      const statusBadge = document.getElementById('engineStatus');
      
      initPromise = initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
      }).then(SQL => {
        dbInstance = SQL;
        statusBadge.textContent = "SQLite Engine Ready";
        statusBadge.className = "status-badge ready";
        return SQL;
      }).catch(err => {
        console.error("Failed to load SQL.js:", err);
        statusBadge.textContent = "Initialization Failed";
        statusBadge.className = "status-badge";
        statusBadge.style.background = "#991b1b";
        statusBadge.style.color = "#fca5a5";
        throw err;
      });

      return initPromise;
    }

    initSqlEngine();

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    // Robust Smart Date Parser for any Diarium schema variation
    function parseRobustDate(rowObj) {
      // 1. Check if explicit Date or CreationDate column exists
      for (const key of ['Date', 'CreationDate', 'date', 'creation_date']) {
        if (rowObj[key]) {
          const d = new Date(rowObj[key]);
          if (!isNaN(d.getTime())) return d;
        }
      }

      // 2. Fall back to DiaryEntryId or first numeric column (Ticks / Timestamp)
      for (const key of ['DiaryEntryId', 'Id', 'ID', 'id']) {
        if (rowObj[key] !== undefined && rowObj[key] !== null) {
          const val = Number(rowObj[key]);
          if (!isNaN(val)) {
            // .NET Ticks format check (> 10^16)
            if (val > 100000000000000000) {
              const ms = Number((BigInt(rowObj[key]) / 10000n) - 62135596800000n);
              const d = new Date(ms);
              if (!isNaN(d.getTime())) return d;
            }
            // Unix Seconds check
            if (val < 10000000000) {
              const d = new Date(val * 1000);
              if (!isNaN(d.getTime())) return d;
            }
            // Unix Milliseconds check
            const d = new Date(val);
            if (!isNaN(d.getTime())) return d;
          }
        }
      }

      return new Date(); // Ultimate fallback
    }

    async function handleFile(file) {
      try {
        const SQL = await initSqlEngine();
        const arrayBuffer = await file.arrayBuffer();
        const uInt8Array = new Uint8Array(arrayBuffer);
        const db = new SQL.Database(uInt8Array);

        // Dynamically fetch table columns and records
        const res = db.exec("SELECT * FROM Entries;");
        if (!res.length || !res[0].values || !res[0].columns) {
          alert("No entry records found in the backup file.");
          return;
        }

        const columns = res[0].columns;
        parsedEntries = res[0].values.map(row => {
          // Map row array to an object with column names as keys
          const rowObj = {};
          columns.forEach((col, idx) => {
            rowObj[col] = row[idx];
          });

          const dateObj = parseRobustDate(rowObj);

          // Use UTC date components to prevent timezone shift bugs & false dates
          const year = dateObj.getUTCFullYear();
          const month = String(dateObj.getUTCFullYear() ? dateObj.getUTCMonth() + 1 : 1).padStart(2, '0');
          const day = String(dateObj.getUTCDate()).padStart(2, '0');
          const dateKey = `${year}-${month}-${day}`;
          const timeStr = dateObj.toLocaleTimeString();

          // Find text and heading dynamically across possible column names
          const rawText = rowObj.Text || rowObj.content || rowObj.Body || "";
          const title = rowObj.Heading || rowObj.Title || rowObj.title || "";

          return {
            dateKey,
            timeStr,
            dateStr: dateObj.toUTCString(),
            title,
            rawText,
            cleanText: cleanHtmlToPlainText(rawText)
          };
        });

        // Sort chronologically by date/time
        parsedEntries.sort((a, b) => a.dateKey.localeCompare(b.dateKey) || a.timeStr.localeCompare(b.timeStr));

        document.getElementById('summaryContent').innerHTML = `
          <p><strong>Total Entries Found:</strong> ${parsedEntries.length}</p>
          <p><strong>Date Range:</strong> ${parsedEntries[0]?.dateKey} — ${parsedEntries[parsedEntries.length - 1]?.dateKey}</p>
        `;
        
        document.getElementById('previewContainer').textContent = parsedEntries.slice(0, 3).map(e => 
          `========================================\nDATE: ${e.dateStr}\nTITLE: ${e.title}\n========================================\n\n${e.cleanText}`
        ).join('\n\n\n');

        document.getElementById('statusCard').classList.remove('hidden');
        document.getElementById('previewCard').classList.remove('hidden');

      } catch (err) {
        alert("Error processing file: " + err.message);
      }
    }

    // Export Obsidian Zip (Grouped by date, appending multiple entries safely)
    document.getElementById('exportObsidianZipBtn').addEventListener('click', async () => {
      if (!parsedEntries.length) return;
      const zip = new JSZip();
      
      const grouped = {};
      parsedEntries.forEach(e => {
        if (!grouped[e.dateKey]) grouped[e.dateKey] = [];
        grouped[e.dateKey].push(e);
      });

      for (const [dateKey, entries] of Object.entries(grouped)) {
        let content = `---
journal: daily
journal-start-date: ${dateKey}
journal-end-date: ${dateKey}
journal-section: day
tags:
  - journal
  - daily
---

# Daily Log - ${dateKey}
`;

        entries.forEach((e, idx) => {
          if (idx > 0) {
            content += `\n\n---\n\n### Additional Entry (${e.timeStr})\n\n`;
          } else {
            content += `\n`;
          }
          if (e.title && e.title !== "Daily Log") {
            content += `**${e.title}**\n\n`;
          }
          content += e.cleanText;
        });

        zip.file(`${dateKey}.md`, content);
      }

      const content = await zip.generateAsync({ type: "blob" });
      downloadFile(content, 'Obsidian_Diarium_Vault.zip', 'application/zip');
    });

    document.getElementById('exportTxtBtn').addEventListener('click', () => {
      if (!parsedEntries.length) return;
      const content = parsedEntries.map(e => 
        `========================================\nDATE: ${e.dateStr}\nTITLE: ${e.title}\n========================================\n\n${e.cleanText}`
      ).join('\n\n\n');
      
      downloadFile(content, 'Diarium_Backup_Export.txt', 'text/plain;charset=utf-8');
    });

    document.getElementById('exportDocxBtn').addEventListener('click', () => {
      if (!parsedEntries.length || typeof docx === 'undefined') return;

      const paragraphs = [];
      parsedEntries.forEach(e => {
        paragraphs.push(
          new docx.Paragraph({
            text: e.dateStr,
            heading: docx.HeadingLevel.HEADING_2,
            spaceAfter: 100,
          })
        );
        if (e.title) {
          paragraphs.push(
            new docx.Paragraph({
              text: e.title,
              heading: docx.HeadingLevel.HEADING_3,
              spaceAfter: 200,
            })
          );
        }

        e.cleanText.split('\n').forEach(line => {
          paragraphs.push(new docx.Paragraph({ text: line }));
        });

        paragraphs.push(
          new docx.Paragraph({
            text: "--------------------------------------------------------------------------------",
            spaceBefore: 300,
            spaceAfter: 300,
          })
        );
      });

      const doc = new docx.Document({
        sections: [{ properties: {}, children: paragraphs }]
      });

      docx.Packer.toBlob(doc).then(blob => {
        downloadFile(blob, 'Diarium_Backup_Export.docx', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      });
    });

    function downloadFile(data, filename, type) {
      const blob = data instanceof Blob ? data : new Blob([data], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
